name: seguros-saas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-seguros_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seguros-net

  # MinIO — armazenamento S3-compatível para desenvolvimento (bucket em endereço local,
  # sem custo nem credenciais AWS). Produção troca por S3/R2 real: basta apontar
  # STORAGE_ENDPOINT para o serviço e preencher STORAGE_ACCESS_KEY_ID/SECRET no .env.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # CORS permitido no upload direto do navegador (PUT cross-origin).
      # O MinIO não implementa PutBucketCors da S3 API; o controle é por aqui.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000" # API S3 (usada pelo backend via STORAGE_ENDPOINT)
      - "9001:9001" # Console web do MinIO (login minioadmin/minioadmin)
    volumes:
      - minio_data:/data
    networks:
      - seguros-net

  # Cria o bucket garantindo que ele exista (aplica CORS é controlado no servidor
  # via MINIO_API_CORS_ALLOW_ORIGIN, default "*"). Roda e encerra (restart: "no").
  # Usa a CLI oficial da AWS (amazon/aws-cli), que fala com qualquer API
  # S3-compatível — inclusive o MinIO — via --endpoint-url.
  minio-init:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_EC2_METADATA_DISABLED: "true"
      MINIO_BUCKET: ${STORAGE_BUCKET:-seguros-saas-dev}
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
        echo 'aguardando MinIO...'; sleep 2;
      done;
      aws --endpoint-url http://minio:9000 --region us-east-1 s3 mb s3://"$${MINIO_BUCKET}" 2>/dev/null || echo 'bucket ja existe';
      echo 'MinIO pronto: bucket '$${MINIO_BUCKET}' criado.'
      "
    networks:
      - seguros-net

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seguros_saas}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seguros-net

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    depends_on:
      - api
    networks:
      - seguros-net

  workers:
    build:
      context: .
      dockerfile: infra/docker/workers.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seguros_saas}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seguros-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./infra/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - seguros-net

  # Renovação automática do certificado Let's Encrypt (roda a cada 12h, só emite se necessário)
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./infra/nginx/certbot/conf:/etc/letsencrypt
      - ./infra/nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done;"

networks:
  seguros-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
