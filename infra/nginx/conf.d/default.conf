# infra/nginx/conf.d/default.conf
#
# Fase 4: HTTP simples, proxy para web (Next.js) e api (NestJS).
# Fase 16 (deploy em produção): descomentar o bloco SSL e o redirect 80->443
# depois de emitir o certificado com:
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d SEU_DOMINIO

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    # Necessário para o desafio HTTP-01 do Let's Encrypt (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api_upstream/docs;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Bloco SSL — ativar na Fase 16 ────────────────────────────────
    # server {
    #     listen 443 ssl;
    #     server_name SEU_DOMINIO;
    #
    #     ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
